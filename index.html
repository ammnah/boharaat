<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>طلبات البهارات الرهيبة والقهوة الرهيبة 😎</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h2>إضافة طلب جديد</h2>
  <form id="orderForm">
    <label>اسم الزبون:</label>
    <input type="text" id="customer" required>

    <label>نوع المنتج:</label>
    <select id="product" required onchange="handleProductChange()">
      <option value="البهارات الرهيبة 😎">البهارات الرهيبة 😎</option>
      <option value="القهوة الرهيبة 😎">القهوة الرهيبة 😎</option>
    </select>

    <div id="dynamicField"></div>

    <label>الكمية:</label>
    <input type="number" id="quantity" required>

    <label>السعر:</label>
    <input type="number" id="price" required>

    <label for="payment">هل تم الدفع؟</label>
    <select id="payment">
      <option value="yes">نعم</option>
      <option value="no">لا</option>
    </select>

    <button type="submit">حفظ الطلب</button>
  </form>

  <h2>الطلبات المحفوظة</h2>
  <table id="ordersTable">
    <thead>
      <tr>
        <th>الزبون</th>
        <th>المنتج</th>
        <th>الكمية</th>
        <th>السعر</th>
        <th>التاريخ</th>
        <th>تم الدفع</th>
        <th>حذف</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>بهارات</td>
        <td>
          <div class="payment-status">
            <label for="payment">هل تم الدفع؟</label>
            <select id="payment">
              <option value="yes">نعم</option>
              <option value="no">لا</option>
            </select>
          </div>
        </td>
        <td><button class="delete-btn" onclick="confirm('هل أنت متأكد أنك تريد الحذف؟')">حذف</button></td>
      </tr>
    </tbody>
  </table>

  <button onclick="window.print()">🧾 طباعة الفاتورة</button>

  <script src="script.js"></script>
</body>
</html>
